name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Backend tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - config-server
          - eureka-server
          - investment-service
          - messaging-service
          - notification-service
          - startup-service
          - team-service
          - user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw
        working-directory: ${{ matrix.service }}

      - name: Run tests
        run: ./mvnw -q test
        working-directory: ${{ matrix.service }}

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: founderlink-new-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: founderlink-new-frontend

      - name: Build frontend
        run: npm run build
        working-directory: founderlink-new-frontend

  publish-images:
    name: Publish Docker images (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            context: api-gateway
          - image: auth-service
            context: auth-service
          - image: config-server
            context: config-server
          - image: eureka-server
            context: eureka-server
          - image: investment-service
            context: investment-service
          - image: messaging-service
            context: messaging-service
          - image: notification-service
            context: notification-service
          - image: startup-service
            context: startup-service
          - image: team-service
            context: team-service
          - image: user-service
            context: user-service
          - image: frontend
            context: founderlink-new-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/founderlink-${{ matrix.image }}:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/founderlink-${{ matrix.image }}:${{ github.sha }}
