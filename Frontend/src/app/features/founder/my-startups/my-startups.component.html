<div class="flex flex-col gap-6">
  
  <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-surface-border pb-6">
    <div>
      <h1 class="text-3xl font-bold text-text-primary">My Startups</h1>
      <p class="text-text-muted mt-1">Manage and track the progress of your founded enterprises.</p>
    </div>
    <button pButton label="Create Startup" icon="pi pi-plus" [routerLink]="['/founder/startups/new']"></button>
  </div>
  
  <p-confirmDialog [style]="{width: '50vw'}"></p-confirmDialog>

  <!-- Skeletons -->
  <div *ngIf="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let _ of [1,2,3]" class="h-64 bg-surface-card rounded-xl animate-pulse"></div>
  </div>

  <!-- Cards -->
  <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let s of startups" 
         class="bg-surface-card border border-surface-border rounded-xl p-5 flex flex-col group relative overflow-hidden">
         
         <div class="absolute top-0 left-0 w-full h-1"
              [ngClass]="{
                'bg-yellow-500': s.status === 'PENDING',
                'bg-emerald-500': s.status === 'OPEN',
                'bg-slate-500': s.status === 'CLOSED',
                'bg-red-500': s.status === 'REJECTED'
              }"></div>
         
      <div class="flex justify-between items-start mb-3 mt-1">
        <h3 class="text-xl font-bold text-text-primary">{{ s.name }}</h3>
        <span class="px-2 py-1 text-[10px] rounded p-tag bg-surface border"
              [ngClass]="{
                'text-yellow-500 border-yellow-500/50': s.status === 'PENDING',
                'text-emerald-500 border-emerald-500/50': s.status === 'OPEN',
                'text-slate-500 border-slate-500/50': s.status === 'CLOSED',
                'text-red-500 border-red-500/50': s.status === 'REJECTED'
              }">
          {{ s.status }}
        </span>
      </div>
      <p class="text-text-muted text-sm mb-4 line-clamp-2 h-10">{{ s.tagline || s.description }}</p>
      
      <div class="mb-4">
        <div class="flex justify-between text-xs font-semibold text-text-muted mb-1">
          <span>{{ s.currentFunding | currencyFormat }} Raised</span>
          <span class="text-emerald-500">{{ (s.currentFunding / s.fundingGoal * 100) | number:'1.0-0' }}%</span>
        </div>
        <div class="w-full bg-surface rounded-full h-2">
          <div class="bg-emerald-500 h-2 rounded-full" [style.width.%]="(s.currentFunding / s.fundingGoal * 100)"></div>
        </div>
      </div>
      
      <div class="mt-auto pt-4 border-t border-surface-border grid grid-cols-2 gap-2 text-text-primary">
         <button pButton label="Edit" icon="pi pi-pencil" [outlined]="true" [routerLink]="['/founder/startups', s.id, 'edit']" styleClass="w-full p-button-sm"></button>
         <button pButton label="Team" icon="pi pi-users" [outlined]="true" [routerLink]="['/founder/startups', s.id, 'team']" styleClass="w-full p-button-sm"></button>
         <button pButton label="Investments" icon="pi pi-chart-pie" [outlined]="true" [routerLink]="['/founder/startups', s.id, 'investments']" styleClass="w-full p-button-sm"></button>
         <button pButton label="Public View" icon="pi pi-external-link" [outlined]="true" severity="info" [routerLink]="['/startups', s.id]" styleClass="w-full p-button-sm"></button>
      </div>
      
      <button class="absolute top-4 right-4 text-text-muted hover:text-danger z-10" *ngIf="s.status !== 'OPEN'" (click)="confirmDelete(s.id, $event)">
         <i class="pi pi-trash"></i>
      </button>
    </div>
    
    <div *ngIf="startups.length === 0" class="col-span-full text-center py-12 text-text-muted border border-dashed border-surface-border rounded-xl">
      You haven't created any startups yet.
      <br><button pButton label="Create your first startup" class="mt-4" [routerLink]="['/founder/startups/new']"></button>
    </div>
  </div>
</div>
