<div class="max-w-4xl mx-auto flex flex-col gap-6">
  
  <div class="flex items-center gap-4 border-b border-surface-border pb-6">
    <a routerLink="/founder/my-startups" class="w-10 h-10 rounded-full bg-surface-card border border-surface-border flex items-center justify-center text-text-muted hover:text-text-primary transition-colors">
      <i class="pi pi-arrow-left"></i>
    </a>
    <div>
      <h1 class="text-3xl font-bold text-text-primary">{{ isEdit ? 'Edit Startup' : 'Create Startup' }}</h1>
      <p class="text-text-muted mt-1">{{ isEdit ? 'Update your company profile and metrics.' : 'Pitch your idea to the world.' }}</p>
    </div>
  </div>

  <form [formGroup]="startupForm" (ngSubmit)="onSubmit()" class="bg-surface-card border border-surface-border rounded-xl p-6 md:p-8 flex flex-col gap-8">
     
     <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Company Name *</label>
           <input pInputText formControlName="name" class="w-full" placeholder="e.g. Acme Corp" />
        </div>
        <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Tagline</label>
           <input pInputText formControlName="tagline" class="w-full" placeholder="Short and catchy..." />
        </div>
     </div>

     <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-text-muted">Full Description *</label>
        <textarea pInputTextarea formControlName="description" rows="5" class="w-full" placeholder="What does your company do? What problem do you solve?"></textarea>
     </div>

     <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-4 border-t border-surface-border">
        <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Category *</label>
           <p-dropdown [options]="categories" formControlName="category" placeholder="Select Industry" styleClass="w-full"></p-dropdown>
        </div>
        <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Current Stage</label>
           <p-dropdown [options]="stages" formControlName="stage" placeholder="Select Stage" styleClass="w-full"></p-dropdown>
        </div>
        <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Funding Round</label>
           <p-dropdown [options]="rounds" formControlName="currentRound" placeholder="Select Round" styleClass="w-full"></p-dropdown>
        </div>
     </div>

     <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-surface-border">
        <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Funding Goal ($) *</label>
           <p-inputNumber formControlName="fundingGoal" mode="currency" currency="USD" locale="en-US" styleClass="w-full"></p-inputNumber>
        </div>
        <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Pre-money Valuation ($)</label>
           <p-inputNumber formControlName="valuation" mode="currency" currency="USD" locale="en-US" styleClass="w-full"></p-inputNumber>
        </div>
     </div>

     <div class="grid grid-cols-1 md:grid-cols-4 gap-6 pt-4 border-t border-surface-border">
        <div class="flex flex-col gap-2 col-span-2">
           <label class="text-sm font-semibold text-text-muted">Location</label>
           <input pInputText formControlName="location" class="w-full" placeholder="City, Country or Remote" />
        </div>
        <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Founded Year</label>
           <p-inputNumber formControlName="foundedYear" [useGrouping]="false" styleClass="w-full"></p-inputNumber>
        </div>
        <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Team Size</label>
           <p-inputNumber formControlName="teamSize" styleClass="w-full"></p-inputNumber>
        </div>
     </div>

     <div class="flex justify-end pt-6 border-t border-surface-border mt-4">
        <a routerLink="/founder/my-startups" class="px-6 py-2 text-text-muted hover:text-text-primary mr-4 transition-colors leading-relaxed">Cancel</a>
        <button pButton type="submit" [label]="isEdit ? 'Save Changes' : 'Submit for Approval'" [loading]="loading" [disabled]="startupForm.invalid"></button>
     </div>
     
  </form>

</div>
