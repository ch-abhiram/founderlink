<div class="max-w-4xl mx-auto flex flex-col gap-6">
  
  <div class="flex items-center gap-4 border-b border-surface-border pb-6">
    <a routerLink="/founder/my-startups" class="w-10 h-10 rounded-full bg-surface-card border border-surface-border flex items-center justify-center text-text-muted hover:text-text-primary transition-colors">
      <i class="pi pi-arrow-left"></i>
    </a>
    <div>
      <h1 class="text-3xl font-bold text-text-primary">Startup Updates</h1>
      <p class="text-text-muted mt-1">Keep your followers and investors informed.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    
    <!-- Post Update Form -->
    <div class="bg-surface-card border border-surface-border rounded-xl p-6 h-fit sticky top-20">
      <h2 class="text-xl font-bold border-b border-surface-border pb-4 mb-6">Post a New Update</h2>
      <form [formGroup]="updateForm" (ngSubmit)="postUpdate()" class="flex flex-col gap-5">
         
         <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Title *</label>
           <input pInputText formControlName="title" class="w-full" placeholder="Reached 10K MRR!" />
         </div>

         <div class="flex flex-col gap-2">
           <label class="text-sm font-semibold text-text-muted">Content *</label>
           <textarea pInputTextarea formControlName="content" rows="6" class="w-full" placeholder="Share details about your milestone, product launch, or general news..."></textarea>
         </div>

         <div class="flex justify-end mt-2">
           <button pButton type="submit" label="Publish Update" icon="pi pi-send" [loading]="posting" [disabled]="updateForm.invalid" class="w-full"></button>
         </div>
      </form>
    </div>

    <!-- Feed -->
    <div class="flex flex-col gap-6">
       <h2 class="text-xl font-bold px-2">Recent Updates</h2>
       
       <div *ngIf="loading" class="animate-pulse flex flex-col gap-4">
         <div class="h-32 bg-surface-card rounded-xl"></div>
         <div class="h-32 bg-surface-card rounded-xl"></div>
       </div>

       <div *ngIf="!loading && updates.length === 0" class="text-center py-12 text-text-muted border border-dashed border-surface-border rounded-xl">
         No updates posted yet.
       </div>

       <div *ngFor="let u of updates" class="border border-surface-border rounded-xl p-6 bg-surface-card relative group">
         <div class="absolute top-6 right-6 text-xs font-semibold text-text-muted group-hover:text-primary transition-colors">
            {{ u.createdAt | timeAgo }}
         </div>
         <h3 class="font-bold text-lg mb-4 text-text-primary pr-20">{{ u.title }}</h3>
         <p class="text-text-muted whitespace-pre-wrap leading-relaxed text-sm">{{ u.content }}</p>
       </div>
    </div>
    
  </div>

</div>
