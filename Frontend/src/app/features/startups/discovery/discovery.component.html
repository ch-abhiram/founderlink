<div class="max-w-6xl mx-auto flex flex-col gap-6">
  
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h1 class="text-3xl font-bold text-text-primary">Discover Startups</h1>
      <p class="text-text-muted">Find the next unicorn to invest in, filtered by your preferences.</p>
    </div>
  </div>

  <div class="bg-surface-card border border-surface-border p-4 rounded-xl flex flex-wrap gap-4 items-center">
    <div class="flex flex-col w-full sm:w-auto flex-1">
      <label class="text-xs font-semibold text-text-muted mb-1">Category</label>
      <p-dropdown [options]="categories" [(ngModel)]="filters.category" (onChange)="onFilterChange()" styleClass="w-full"></p-dropdown>
    </div>
    
    <div class="flex flex-col w-full sm:w-auto flex-1">
      <label class="text-xs font-semibold text-text-muted mb-1">Stage</label>
      <p-dropdown [options]="stages" [(ngModel)]="filters.stage" (onChange)="onFilterChange()" styleClass="w-full"></p-dropdown>
    </div>
    
    <div class="flex flex-col w-full sm:w-auto flex-1">
      <label class="text-xs font-semibold text-text-muted mb-1">Round</label>
      <p-dropdown [options]="rounds" [(ngModel)]="filters.currentRound" (onChange)="onFilterChange()" styleClass="w-full"></p-dropdown>
    </div>
  </div>

  <div *ngIf="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let _ of [1,2,3,4,5,6]" class="h-[280px] bg-surface-card/50 rounded-xl animate-pulse"></div>
  </div>

  <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let s of startups" 
         [routerLink]="['/startups', s.id]"
         class="bg-surface-card border border-surface-border rounded-xl p-5 cursor-pointer hover:-translate-y-1 hover:border-primary/50 transition-all duration-200 flex flex-col group">
      <div class="flex justify-between items-start mb-3">
        <h3 class="text-xl font-bold text-text-primary group-hover:text-primary transition-colors flex-1 line-clamp-1 mr-2">{{ s.name }}</h3>
        <p-tag severity="success" value="OPEN" [rounded]="true"></p-tag>
      </div>
      <p class="text-text-muted text-sm mb-4 line-clamp-2 min-h-[40px]">{{ s.tagline || s.description }}</p>
      
      <div class="mt-auto">
        <div class="flex justify-between text-xs font-semibold text-text-muted mb-1">
          <span>Progress</span>
          <span class="text-emerald-500">{{ (s.currentFunding / s.fundingGoal * 100) | number:'1.0-0' }}%</span>
        </div>
        <div class="w-full bg-surface rounded-full h-2 mb-4">
          <div class="bg-emerald-500 h-2 rounded-full" [style.width.%]="(s.currentFunding / s.fundingGoal * 100)"></div>
        </div>
        
        <div class="flex justify-between items-center text-sm border-t border-surface-border pt-4">
           <div class="text-text-muted flex gap-2">
             <p-tag [value]="s.category" severity="info" styleClass="text-[10px] px-2 py-0.5" [rounded]="true"></p-tag>
             <p-tag [value]="s.stage || 'Idea'" severity="warning" styleClass="text-[10px] px-2 py-0.5" [rounded]="true"></p-tag>
           </div>
          <span class="font-bold border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded-md">{{ s.fundingGoal | currencyFormat }}</span>
        </div>
      </div>
    </div>
  </div>
  
  <div *ngIf="!loading && startups.length === 0" class="text-center py-16 bg-surface-card border-dashed border border-surface-border rounded-xl text-text-muted">
    <i class="pi pi-search text-3xl mb-4"></i>
    <p>No startups match your current filters.</p>
    <button (click)="filters = {category:null,stage:null,currentRound:null,status:'OPEN'}; onFilterChange()" class="mt-4 text-primary hover:underline font-medium">Clear Filters</button>
  </div>

  <div *ngIf="!loading && totalElements > size" class="mt-4 flex justify-center">
    <p-paginator [rows]="size" [totalRecords]="totalElements" (onPageChange)="onPageChange($event)"></p-paginator>
  </div>

</div>
