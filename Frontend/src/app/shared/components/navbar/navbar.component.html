<nav class="h-16 bg-surface-card border-b border-surface-border px-4 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <a routerLink="/" class="text-xl font-bold text-primary flex items-center gap-2">
      <i class="pi pi-bolt text-2xl"></i>
      <span>FounderLink</span>
    </a>
  </div>
  
  <div class="flex items-center gap-6">
    <button (click)="toggleTheme()" class="text-text-muted hover:text-text-primary transition-colors">
      <i class="pi text-xl" [ngClass]="isDark ? 'pi-sun' : 'pi-moon'"></i>
    </button>
    
    <ng-container *ngIf="!isAuthenticated">
      <a routerLink="/startups" class="text-text-muted hover:text-text-primary transition-colors font-medium">Browse Startups</a>
      <a routerLink="/login" class="text-text-muted hover:text-text-primary transition-colors font-medium">Login</a>
      <a routerLink="/register" class="bg-primary hover:bg-primary-dark text-white px-4 py-2 rounded-lg font-medium transition-colors">Register</a>
    </ng-container>

    <ng-container *ngIf="isAuthenticated">
      <app-notification-bell></app-notification-bell>
      <button (click)="logout()" class="text-danger hover:text-danger/80 transition-colors">
        <i class="pi pi-sign-out text-xl"></i>
      </button>
    </ng-container>
  </div>
</nav>
