<aside class="h-full flex flex-col pt-6">
  <div class="px-4 mb-4 text-xs font-semibold text-text-muted uppercase tracking-wider">
    Menu
  </div>
  <nav class="flex-1 px-2 space-y-1">
    <a *ngFor="let item of filteredNavItems"
       [routerLink]="item.route"
       routerLinkActive="bg-primary/10 text-primary border-r-2 border-primary"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-muted hover:bg-surface hover:text-text-primary transition-colors font-medium">
      <i class="pi {{ item.icon }} text-lg w-6"></i>
      <span>{{ item.label }}</span>
    </a>
  </nav>
</aside>
