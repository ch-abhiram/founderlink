spring.application.name=api-gateway

server.port=8083

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Gateway discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Actuator
management.endpoints.web.exposure.include=*

# AUTH SERVICE
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# USER SERVICE
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

# ADMIN (routed to user-service)
spring.cloud.gateway.routes[2].id=admin-service
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/admin/**

# START-UP
spring.cloud.gateway.routes[3].id=startup-service
spring.cloud.gateway.routes[3].uri=lb://STARTUP-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/startups/**

spring.cloud.gateway.routes[4].id=investment-service
spring.cloud.gateway.routes[4].uri=lb://INVESTMENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/investments/**


# TEAM-SERVICE
spring.cloud.gateway.routes[5].id=team-service
spring.cloud.gateway.routes[5].uri=lb://TEAM-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/teams/**

# MESSAGING-SERVICE
spring.cloud.gateway.routes[6].id=messaging-service
spring.cloud.gateway.routes[6].uri=lb://MESSAGING-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/messages/**

# NOTIFICATION-SERVICE
spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/notifications/**

springdoc.swagger-ui.path=/swagger-ui.html

# 🔥 Aggregate multiple services
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=User Service
springdoc.swagger-ui.urls[1].url=/users/v3/api-docs

springdoc.swagger-ui.urls[2].name=Startup Service
springdoc.swagger-ui.urls[2].url=/startups/v3/api-docs

springdoc.swagger-ui.urls[3].name=Investment Service
springdoc.swagger-ui.urls[3].url=/investments/v3/api-docs

springdoc.swagger-ui.urls[4].name=Team Service
springdoc.swagger-ui.urls[4].url=/teams/v3/api-docs

springdoc.swagger-ui.urls[5].name=Messaging Service
springdoc.swagger-ui.urls[5].url=/messages/v3/api-docs

springdoc.swagger-ui.urls[6].name=Notification Service
springdoc.swagger-ui.urls[6].url=/notifications/v3/api-docs

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# JWT
# Load from environment variable; MUST match auth-service's secret
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey}


spring.data.redis.host=localhost
spring.data.redis.port=6379