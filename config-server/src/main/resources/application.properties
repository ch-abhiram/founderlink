server.port=8888
spring.application.name=config-server
spring.profiles.active=${CONFIG_SERVER_BACKEND:git}

# Public GitHub-backed Config Server
spring.cloud.config.server.git.uri=${CONFIG_SERVER_GIT_URI:https://github.com/ch-abhiram/founderlink-config-repo}
spring.cloud.config.server.git.default-label=${CONFIG_SERVER_GIT_LABEL:main}
spring.cloud.config.server.git.clone-on-start=${CONFIG_SERVER_GIT_CLONE_ON_START:true}
spring.cloud.config.server.git.force-pull=${CONFIG_SERVER_GIT_FORCE_PULL:true}
spring.cloud.config.server.git.search-paths=${CONFIG_SERVER_GIT_SEARCH_PATHS:.,config-repo}
spring.cloud.config.server.git.timeout=${CONFIG_SERVER_GIT_TIMEOUT:10}
spring.cloud.config.server.native.search-locations=${CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS:file:./config-repo,file:./src/main/resources/config}
