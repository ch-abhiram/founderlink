<div class="auth-page">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-card glass-strong animate-scale-in">
    <div class="auth-brand">
      <div class="brand-icon"><i class="pi pi-link"></i></div>
      <span class="brand-name display">FounderLink</span>
    </div>

    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Sign in to your account to continue.</p>

    <div class="error-msg" *ngIf="error">
      <i class="pi pi-exclamation-circle"></i> {{ error }}
    </div>

    <form class="auth-form" (ngSubmit)="submit()">
      <div class="field">
        <label class="fl-label">Email address</label>
        <input class="fl-input" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label class="fl-label">Password</label>
        <div class="pw-wrap">
          <input class="fl-input" [type]="showPw ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="pw-toggle" (click)="showPw = !showPw">
            <i class="pi" [class.pi-eye]="!showPw" [class.pi-eye-slash]="showPw"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary submit-btn" [disabled]="loading">
        <span class="spinner" *ngIf="loading"></span>
        <span *ngIf="!loading"><i class="pi pi-sign-in"></i> Sign In</span>
        <span *ngIf="loading">Signing in…</span>
      </button>
    </form>

    <p class="auth-switch">
      Don't have an account? <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
