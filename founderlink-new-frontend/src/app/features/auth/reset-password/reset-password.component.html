<div class="auth-page">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-card glass-strong animate-scale-in">
    <div class="auth-brand">
      <div class="brand-icon"><i class="pi pi-link"></i></div>
      <span class="brand-name display">FounderLink</span>
    </div>

    <h2 class="auth-title">Choose a new password</h2>
    <p class="auth-sub">Enter the reset code from your email and set a new password.</p>

    <div class="error-msg" *ngIf="error">
      <i class="pi pi-exclamation-circle"></i> {{ error }}
    </div>

    <div *ngIf="message" style="margin-bottom:16px;color:var(--accent-green)">
      <i class="pi pi-check-circle"></i> {{ message }}
    </div>

    <form class="auth-form" (ngSubmit)="submit()">
      <div class="field">
        <label class="fl-label">Email address</label>
        <input class="fl-input" type="email" [(ngModel)]="form.email" name="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label class="fl-label">Reset code</label>
        <input class="fl-input" type="text" [(ngModel)]="form.token" name="token" placeholder="6-digit code" autocomplete="one-time-code" />
      </div>

      <div class="field">
        <label class="fl-label">New password</label>
        <div class="pw-wrap">
          <input class="fl-input" [type]="showPw ? 'text' : 'password'" [(ngModel)]="form.newPassword" name="newPassword" placeholder="Min. 8 characters" autocomplete="new-password" />
          <button type="button" class="pw-toggle" (click)="showPw = !showPw">
            <i class="pi" [class.pi-eye]="!showPw" [class.pi-eye-slash]="showPw"></i>
          </button>
        </div>
      </div>

      <div class="field">
        <label class="fl-label">Confirm password</label>
        <input class="fl-input" [type]="showPw ? 'text' : 'password'" [(ngModel)]="form.confirmPassword" name="confirmPassword" placeholder="Repeat new password" autocomplete="new-password" />
      </div>

      <button type="submit" class="btn-primary submit-btn" [disabled]="loading">
        <span class="spinner" *ngIf="loading"></span>
        <span *ngIf="!loading"><i class="pi pi-lock"></i> Reset Password</span>
        <span *ngIf="loading">Resettingâ€¦</span>
      </button>
    </form>

    <p class="auth-switch">
      Back to <a routerLink="/login">sign in</a>
    </p>
  </div>
</div>
