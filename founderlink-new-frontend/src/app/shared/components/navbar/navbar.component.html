<header class="navbar">
  <div class="navbar-left">
    <button class="hamburger" (click)="onToggle()">
      <i class="pi pi-bars"></i>
    </button>
    <div class="breadcrumb-line"></div>
  </div>
  <div class="navbar-right">
    <a routerLink="/notifications" class="notif-btn" *ngIf="isAuthenticated">
      <i class="pi pi-bell"></i>
      <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
    </a>
    <a routerLink="/messages" class="notif-btn" *ngIf="isAuthenticated">
      <i class="pi pi-comments"></i>
    </a>
    <a routerLink="/profile" class="profile-link" *ngIf="isAuthenticated">
      <i class="pi pi-user"></i>
    </a>
  </div>
</header>
